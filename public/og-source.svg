<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hand-authored SakuraCord social preview.
  The product window is the real client screenshot from /public/media.
  Render at 1200x630 to update og-v2.png.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">SakuraCord — Discord, at home on the Mac.</title>
  <desc id="description">
    SakuraCord branding above a real screenshot of the native macOS client.
  </desc>

  <defs>
    <style>
      @font-face {
        font-family: "LADisplay";
        src: url("fonts/LADisplay-VF.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
      }
      @font-face {
        font-family: "LAText";
        src: url("fonts/LAText-VF.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
      }
    </style>
    <linearGradient id="background" x1="50" y1="24" x2="1150" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0b12" />
      <stop offset="0.55" stop-color="#17101b" />
      <stop offset="1" stop-color="#44243c" />
    </linearGradient>
    <radialGradient id="pink-glow" cx="0" cy="0" r="1" gradientTransform="translate(1045 58) rotate(137) scale(560 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f49ac1" stop-opacity="0.5" />
      <stop offset="0.48" stop-color="#c65f97" stop-opacity="0.16" />
      <stop offset="1" stop-color="#7c3865" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="headline" x1="65" y1="176" x2="708" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0.62" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f49ac1" />
    </linearGradient>
    <linearGradient id="window-border" x1="70" y1="344" x2="1116" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#f3c9dc" stop-opacity="0.14" />
      <stop offset="1" stop-color="#f49ac1" stop-opacity="0.3" />
    </linearGradient>
    <clipPath id="window-clip">
      <rect x="54" y="350" width="1092" height="600" rx="26" />
    </clipPath>
    <filter id="window-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#f49ac1" flood-opacity="0.12" />
    </filter>
    <filter id="icon-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#pink-glow)" />

  <g filter="url(#icon-shadow)">
    <image
      x="64"
      y="51"
      width="82"
      height="82"
      preserveAspectRatio="xMidYMid meet"
      href="brand/sakuracord-app-icon.png"
      xlink:href="brand/sakuracord-app-icon.png"
    />
  </g>

  <text
    x="166"
    y="108"
    fill="#ffffff"
    font-family="LADisplay, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="53"
    font-weight="720"
    letter-spacing="-1.5"
  >SakuraCord</text>

  <text
    x="64"
    y="220"
    fill="url(#headline)"
    font-family="LADisplay, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="73"
    font-weight="760"
    letter-spacing="-2.2"
  >
    <tspan x="64" dy="0">Discord, at home</tspan>
    <tspan x="64" dy="76">on the Mac.</tspan>
  </text>

  <text
    x="1136"
    y="242"
    fill="#e7dde7"
    font-family="LAText, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="27"
    font-weight="540"
    letter-spacing="-0.25"
    text-anchor="end"
  >
    <tspan x="1136" dy="0">Native SwiftUI</tspan>
    <tspan x="1136" dy="35">Voice &amp; video · macOS 27+</tspan>
  </text>

  <g filter="url(#window-shadow)">
    <rect x="53" y="349" width="1094" height="602" rx="27" fill="#201f27" />
    <image
      x="54"
      y="350"
      width="1092"
      height="600"
      preserveAspectRatio="xMidYMin slice"
      clip-path="url(#window-clip)"
      href="media/sakuracord-client-preview.webp"
      xlink:href="media/sakuracord-client-preview.webp"
    />
    <rect x="53.5" y="349.5" width="1093" height="601" rx="26.5" fill="none" stroke="url(#window-border)" />
  </g>
</svg>
